<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #arvore{
        display:flex;
        justify-content:center;
        margin-top:40px;
    }

    .tree-node{
        display:flex;
        flex-direction:column;
        align-items:center;
        margin:20px;
    }

    .keys{
        display:flex;
        border:2px solid #222;
        border-radius:6px;
        overflow:hidden;
        background:#fff;
    }

    .key{
        padding:12px 18px;
        border-right:2px solid #222;
        font-weight:bold;
    }

    .key:last-child{
        border-right:none;
    }

    .children{
        display:flex;
        justify-content:center;
        gap:40px;
        margin-top:25px;
    }
    </style>
</head>
<body>
    <h1>Visualização da Árvore B</h1>

    <div id="arvore"></div>

    <script src="tree.js"></script>
</body>
</html>
